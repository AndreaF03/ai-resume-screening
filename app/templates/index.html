<!DOCTYPE html>
<html>
<head>
    <title>AI Resume Screening</title>
</head>
<body>
    <h2>AI Resume Screening System</h2>

    <form action="/analyze" method="post" enctype="multipart/form-data">
        <label>Upload Resume (PDF):</label><br>
        <input type="file" name="resume" required><br><br>

        <label>Paste Job Description:</label><br>
        <textarea name="job_description" rows="8" cols="60" required></textarea><br><br>

        <button type="submit">Analyze</button>
    </form>

    {% if score %}
        <h3>Match Score: {{score}}%</h3>
    {% endif %}

</body>
</html>
